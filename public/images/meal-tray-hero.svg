<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radial shadow under tray -->
    <radialGradient id="trayShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Tray gradients -->
    <linearGradient id="trayRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="trayInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Burger bun gradients -->
    <linearGradient id="bunTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bunBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Fries gradients -->
    <linearGradient id="friesBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="fryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drink Cup gradients -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Pizza slice gradient -->
    <linearGradient id="pizzaCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pizzaCheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Sparkle Accents -->
  <g opacity="0.9">
    <path d="M 125 75 Q 127 83 135 85 Q 127 87 125 95 Q 123 87 115 85 Q 123 83 125 75 Z" fill="#fde047" />
    <path d="M 310 65 Q 312 71 318 73 Q 312 75 310 81 Q 308 75 302 73 Q 308 71 310 65 Z" fill="#ffffff" />
    <circle cx="100" cy="110" r="3" fill="#fef08a" />
    <circle cx="330" cy="115" r="3.5" fill="#fef08a" />
    <!-- Rays above burger -->
    <line x1="205" y1="70" x2="205" y2="52" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    <line x1="225" y1="74" x2="238" y2="58" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="74" x2="172" y2="58" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ground / Platter Shadow -->
  <ellipse cx="210" cy="272" rx="175" ry="32" fill="url(#trayShadow)" />

  <!-- RED SERVING TRAY -->
  <!-- Outer rim -->
  <ellipse cx="210" cy="254" rx="160" ry="30" fill="url(#trayRimGrad)" />
  <ellipse cx="210" cy="252" rx="156" ry="28" fill="#991b1b" />
  <!-- Inner dish surface -->
  <ellipse cx="210" cy="250" rx="146" ry="24" fill="url(#trayInnerGrad)" />
  <!-- Rim highlight -->
  <path d="M 68 252 A 146 24 0 0 0 352 252" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" fill="none" />

  <!-- ==============================================
       ITEM 1: FRENCH FRIES (Left side of tray)
       ============================================== -->
  <g transform="translate(68, 86)">
    <!-- Back Fries -->
    <rect x="24" y="2" width="9" height="60" rx="2.5" fill="url(#fryGrad)" transform="rotate(-14 28 32)" />
    <rect x="36" y="-6" width="9" height="66" rx="2.5" fill="url(#fryGrad)" transform="rotate(-6 40 30)" />
    <rect x="48" y="-12" width="10" height="72" rx="2.5" fill="url(#fryGrad)" transform="rotate(3 53 28)" />
    <rect x="60" y="-8" width="9" height="68" rx="2.5" fill="url(#fryGrad)" transform="rotate(10 64 30)" />
    <rect x="70" y="4" width="9" height="56" rx="2.5" fill="url(#fryGrad)" transform="rotate(18 74 34)" />
    <!-- Front row fries -->
    <rect x="30" y="16" width="8" height="48" rx="2" fill="#fef08a" transform="rotate(-10 34 40)" />
    <rect x="42" y="10" width="8" height="52" rx="2" fill="#fde047" transform="rotate(1 46 36)" />
    <rect x="54" y="12" width="8" height="50" rx="2" fill="#fde047" transform="rotate(8 58 37)" />

    <!-- Red Fry Carton Box -->
    <path d="M 18 52 L 28 116 Q 52 120 78 116 L 88 52 Q 53 66 18 52 Z" fill="url(#friesBoxGrad)" />
    <!-- Box Front Arc highlight -->
    <path d="M 28 58 Q 53 68 78 58" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" />
    <!-- White CanteenGo Cloche icon on carton -->
    <circle cx="53" cy="90" r="14" fill="#ffffff" opacity="0.95" />
    <path d="M 46 93 C 46 87 60 87 60 93 Z" fill="#ef4444" />
    <line x1="44" y1="94" x2="62" y2="94" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="53" cy="85.5" r="1.5" fill="#ef4444" />
  </g>

  <!-- ==============================================
       ITEM 2: SODA CUP WITH STRAW (Right side of tray)
       ============================================== -->
  <g transform="translate(262, 90)">
    <!-- Striped Straw sticking out -->
    <path d="M 40 -12 L 48 30" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
    <path d="M 39 -14 L 30 -24" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
    <path d="M 33 -20 L 37 -16" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />
    <path d="M 43 0 L 45 8" stroke="#ef4444" stroke-width="7" />
    <path d="M 46 16 L 47 24" stroke="#ef4444" stroke-width="7" />

    <!-- Cup Lid -->
    <ellipse cx="48" cy="30" rx="36" ry="9" fill="#f8fafc" />
    <ellipse cx="48" cy="27" rx="32" ry="7" fill="#e2e8f0" />
    <rect x="14" y="28" width="68" height="4" rx="2" fill="#cbd5e1" />

    <!-- Red Cup Body -->
    <path d="M 18 32 L 26 122 Q 48 127 70 122 L 78 32 Q 48 37 18 32 Z" fill="url(#cupGrad)" />

    <!-- Cloche Badge on Cup -->
    <circle cx="48" cy="76" r="13" fill="#ffffff" opacity="0.92" />
    <path d="M 42 79 C 42 73 54 73 54 79 Z" fill="#ef4444" />
    <line x1="40" y1="80" x2="56" y2="80" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="48" cy="72" r="1.2" fill="#ef4444" />
  </g>

  <!-- ==============================================
       ITEM 3: JUICY BURGER (Center Front)
       ============================================== -->
  <g transform="translate(136, 122)">
    <!-- Burger Bottom Bun -->
    <ellipse cx="74" cy="116" rx="54" ry="16" fill="url(#bunBottomGrad)" />

    <!-- Patty -->
    <rect x="18" y="96" width="112" height="18" rx="8" fill="url(#pattyGrad)" />
    <!-- Patty grill highlight -->
    <rect x="22" y="99" width="104" height="4" rx="2" fill="#92400e" opacity="0.7" />

    <!-- Melted Cheese Layer (yellow draped triangles) -->
    <path d="M 18 94 L 130 94 L 126 104 L 110 98 L 94 112 L 80 98 L 62 108 L 44 98 L 30 106 L 22 96 Z" fill="#facc15" />

    <!-- Fresh Lettuce (Green ruffle ribbon) -->
    <path d="M 14 87 Q 26 95 38 88 Q 50 82 62 90 Q 76 96 90 87 Q 104 81 116 89 Q 126 95 134 87 L 130 93 L 18 93 Z" fill="#22c55e" />
    <path d="M 20 89 Q 34 83 48 91 Q 62 85 76 92 Q 90 86 104 92 Q 118 85 130 91" stroke="#16a34a" stroke-width="2" fill="none" />

    <!-- Sliced Tomatoes (red layers peek) -->
    <rect x="24" y="80" width="46" height="8" rx="4" fill="#dc2626" />
    <rect x="76" y="80" width="48" height="8" rx="4" fill="#ef4444" />

    <!-- Burger Top Bun (Rounded Dome) -->
    <path d="M 16 80 C 16 34, 132 34, 132 80 C 132 84, 16 84, 16 80 Z" fill="url(#bunTopGrad)" />

    <!-- Bun Top Highlight -->
    <ellipse cx="74" cy="50" rx="40" ry="14" fill="rgba(255,255,255,0.2)" />

    <!-- White Sesame Seeds on top bun -->
    <g fill="#fef9c3" opacity="0.95">
      <!-- Row 1 -->
      <ellipse cx="50" cy="54" rx="2" ry="3.5" transform="rotate(-25 50 54)" />
      <ellipse cx="68" cy="46" rx="2" ry="3.5" transform="rotate(10 68 46)" />
      <ellipse cx="88" cy="48" rx="2" ry="3.5" transform="rotate(30 88 48)" />
      <ellipse cx="102" cy="56" rx="2" ry="3.5" transform="rotate(45 102 56)" />
      <!-- Row 2 -->
      <ellipse cx="40" cy="65" rx="2" ry="3.5" transform="rotate(-40 40 65)" />
      <ellipse cx="58" cy="62" rx="2" ry="3.5" transform="rotate(-5 58 62)" />
      <ellipse cx="78" cy="60" rx="2" ry="3.5" transform="rotate(15 78 60)" />
      <ellipse cx="96" cy="64" rx="2" ry="3.5" transform="rotate(35 96 64)" />
      <!-- Row 3 -->
      <ellipse cx="48" cy="74" rx="2" ry="3.5" transform="rotate(-15 48 74)" />
      <ellipse cx="70" cy="72" rx="2" ry="3.5" transform="rotate(5 70 72)" />
      <ellipse cx="88" cy="73" rx="2" ry="3.5" transform="rotate(25 88 73)" />
      <ellipse cx="110" cy="70" rx="2" ry="3.5" transform="rotate(50 110 70)" />
    </g>
  </g>

  <!-- ==============================================
       ITEM 4: PIZZA SLICE (Resting on left corner)
       ============================================== -->
  <g transform="translate(74, 178) rotate(-18)">
    <!-- Pizza Shadow -->
    <polygon points="12,70 65,10 68,70" fill="rgba(0,0,0,0.18)" />

    <!-- Pizza Crust (Thick Back Arc) -->
    <path d="M 6 60 Q 38 74 72 66 L 76 56 Q 38 64 4 50 Z" fill="url(#pizzaCrust)" />

    <!-- Pizza Cheese Body (Triangle slice) -->
    <path d="M 5 54 L 62 6 Q 66 10 68 16 L 74 60 Q 40 68 5 54 Z" fill="url(#pizzaCheese)" />

    <!-- Melty Cheese dripping line -->
    <path d="M 62 8 Q 50 32 38 48 Q 24 53 6 54" stroke="#fde047" stroke-width="2.5" fill="none" />

    <!-- Pepperoni Slices -->
    <circle cx="34" cy="42" r="7.5" fill="#dc2626" />
    <circle cx="33" cy="41" r="6" fill="#b91c1c" />
    <circle cx="32" cy="40" r="1.5" fill="#fca5a5" />

    <circle cx="54" cy="44" r="7" fill="#dc2626" />
    <circle cx="53" cy="43" r="5.5" fill="#b91c1c" />
    <circle cx="52" cy="42" r="1.5" fill="#fca5a5" />

    <circle cx="48" cy="24" r="6.5" fill="#dc2626" />
    <circle cx="47" cy="23" r="5" fill="#b91c1c" />
    <circle cx="46" cy="22" r="1.2" fill="#fca5a5" />

    <!-- Green herb flakes -->
    <rect x="22" y="48" width="3" height="1.5" rx="0.5" fill="#15803d" transform="rotate(20 22 48)" />
    <rect x="42" y="32" width="3" height="1.5" rx="0.5" fill="#15803d" transform="rotate(-35 42 32)" />
    <rect x="58" y="34" width="3" height="1.5" rx="0.5" fill="#15803d" transform="rotate(45 58 34)" />
  </g>
</svg>

