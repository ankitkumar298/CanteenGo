<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Warm caramel food doodle pattern matching the screenshot -->
  <g stroke="#c98f62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" fill="none">
    
    <!-- 1. Pizza Slice (Top-Left, tilted) -->
    <g transform="translate(24, 20) rotate(-15)">
      <path d="M 0 38 L 40 4 Q 46 12 50 20 L 16 54 Q 6 46 0 38 Z" />
      <!-- Crust curve -->
      <path d="M 0 38 Q 8 46 16 54" stroke-width="2.4" />
      <circle cx="20" cy="30" r="3.2" stroke-width="1.6" />
      <circle cx="30" cy="18" r="2.6" stroke-width="1.6" />
      <circle cx="34" cy="28" r="2.2" stroke-width="1.6" />
    </g>

    <!-- 2. Burger (Top-Center) -->
    <g transform="translate(145, 16)">
      <!-- Top Bun -->
      <path d="M 4 22 C 4 8, 46 8, 46 22 Z" />
      <!-- Sesame dots -->
      <circle cx="18" cy="14" r="0.8" fill="#c98f62" />
      <circle cx="28" cy="13" r="0.8" fill="#c98f62" />
      <circle cx="36" cy="16" r="0.8" fill="#c98f62" />
      <!-- Lettuce wavy line -->
      <path d="M 2 25 Q 8 28 14 25 Q 20 28 26 25 Q 32 28 38 25 Q 44 28 48 25" />
      <!-- Cheese / Patty -->
      <rect x="5" y="27" width="40" height="6" rx="2.5" />
      <!-- Bottom Bun -->
      <path d="M 6 36 C 6 42, 44 42, 44 36 Z" />
    </g>

    <!-- 3. Cupcake / Ice Cream (Top-Right) -->
    <g transform="translate(270, 18)">
      <!-- Cherry -->
      <circle cx="24" cy="8" r="3" />
      <path d="M 25 5 Q 30 1 32 3" />
      <!-- Swirl Frosting -->
      <path d="M 12 18 C 12 10, 36 10, 36 18 Q 42 22 38 26 L 10 26 Q 6 22 12 18 Z" />
      <!-- Cup Base -->
      <path d="M 11 26 L 15 42 Q 24 44 33 42 L 37 26 Z" />
      <line x1="19" y1="26" x2="20" y2="42" stroke-width="1.2" />
      <line x1="28" y1="26" x2="27" y2="42" stroke-width="1.2" />
    </g>

    <!-- 4. French Fries (Middle-Left) -->
    <g transform="translate(28, 120)">
      <!-- Carton box -->
      <path d="M 8 24 L 14 54 Q 28 58 42 54 L 48 24 Q 28 32 8 24 Z" />
      <!-- Fry sticks -->
      <line x1="16" y1="26" x2="16" y2="6" />
      <line x1="22" y1="27" x2="21" y2="2" />
      <line x1="28" y1="28" x2="29" y2="0" />
      <line x1="34" y1="27" x2="35" y2="4" />
      <line x1="40" y1="25" x2="42" y2="8" />
    </g>

    <!-- 5. Cloche Serving Tray (Middle-Center) -->
    <g transform="translate(150, 125)">
      <!-- Handle knob -->
      <circle cx="25" cy="8" r="2.5" />
      <!-- Dome cover -->
      <path d="M 6 28 C 6 12, 44 12, 44 28 Z" />
      <!-- Plate rim -->
      <line x1="2" y1="30" x2="48" y2="30" stroke-width="2.2" />
      <!-- Platter base -->
      <path d="M 10 32 L 40 32" stroke-width="1.6" />
    </g>

    <!-- 6. Soda Cup with Straw (Middle-Right) -->
    <g transform="translate(275, 115)">
      <!-- Bent Straw -->
      <path d="M 32 4 L 28 14 L 24 22" stroke-width="2" />
      <!-- Lid -->
      <ellipse cx="22" cy="22" rx="18" ry="4" />
      <!-- Cup Body -->
      <path d="M 6 24 L 11 58 Q 22 61 33 58 L 38 24 Z" />
      <!-- Emblem circle on cup -->
      <circle cx="22" cy="38" r="5" stroke-width="1.4" />
    </g>

    <!-- 7. Hot Dog with Mustard (Bottom-Left) -->
    <g transform="translate(26, 235) rotate(15)">
      <!-- Bun -->
      <rect x="4" y="10" width="48" height="18" rx="9" />
      <!-- Sausage ends -->
      <path d="M 1 18 Q 4 14 6 18 Q 4 22 1 18 Z" fill="#c98f62" />
      <path d="M 55 18 Q 52 14 50 18 Q 52 22 55 18 Z" fill="#c98f62" />
      <!-- Squiggly Mustard -->
      <path d="M 8 19 Q 14 14 20 19 Q 26 24 32 19 Q 38 14 44 19" stroke-width="2" />
    </g>

    <!-- 8. Crossed Fork & Spoon (Bottom-Center) -->
    <g transform="translate(155, 235)">
      <!-- Fork -->
      <line x1="10" y1="44" x2="38" y2="10" stroke-width="1.8" />
      <path d="M 33 15 Q 40 8 44 12 L 36 20" stroke-width="1.5" />
      <line x1="37" y1="11" x2="42" y2="15" stroke-width="1.4" />
      <!-- Spoon -->
      <line x1="38" y1="44" x2="10" y2="10" stroke-width="1.8" />
      <ellipse cx="9" cy="9" rx="6" ry="8" transform="rotate(-45 9 9)" stroke-width="1.6" />
    </g>

    <!-- 9. Coffee / Chai Mug (Bottom-Right) -->
    <g transform="translate(270, 240)">
      <!-- Steam lines -->
      <path d="M 14 8 Q 16 3 14 0" stroke-width="1.4" />
      <path d="M 22 8 Q 24 3 22 0" stroke-width="1.4" />
      <path d="M 30 8 Q 32 3 30 0" stroke-width="1.4" />
      <!-- Mug body -->
      <rect x="8" y="12" width="30" height="28" rx="4" />
      <!-- Handle -->
      <path d="M 38 18 C 45 18, 45 32, 38 32" stroke-width="2" />
    </g>

    <!-- 10. Little Sparkles, Stars and Donuts in between -->
    <!-- Star 1 (between pizza and burger) -->
    <path d="M 98 42 Q 100 48 106 50 Q 100 52 98 58 Q 96 52 90 50 Q 96 48 98 42 Z" stroke-width="1.2" fill="#c98f62" fill-opacity="0.25" />
    <!-- Donut (between burger and cupcake) -->
    <circle cx="225" cy="48" r="8" stroke-width="1.6" />
    <circle cx="225" cy="48" r="3" stroke-width="1.4" />

    <!-- Sparkle 2 (between fries and cloche) -->
    <path d="M 105 160 Q 107 165 112 166 Q 107 167 105 172 Q 103 167 98 166 Q 103 165 105 160 Z" stroke-width="1.2" fill="#c98f62" fill-opacity="0.2" />
    <!-- Sparkle 3 (between cloche and soda) -->
    <path d="M 235 155 Q 237 160 242 161 Q 237 162 235 167 Q 233 162 228 161 Q 233 160 235 155 Z" stroke-width="1.2" fill="#c98f62" fill-opacity="0.2" />

    <!-- Tiny dots and circles -->
    <circle cx="85" cy="110" r="2" stroke-width="1.2" />
    <circle cx="230" cy="98" r="1.8" stroke-width="1.2" />
    <circle cx="95" cy="225" r="2.2" stroke-width="1.2" />
    <circle cx="245" cy="225" r="2" stroke-width="1.2" />
    <circle cx="150" cy="335" r="1.8" stroke-width="1.2" />
    <circle cx="50" cy="330" r="2.4" stroke-width="1.2" />
    <circle cx="330" cy="330" r="2" stroke-width="1.2" />
  </g>
</svg>
